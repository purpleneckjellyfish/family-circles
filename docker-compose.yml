services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: familycircles
      POSTGRES_PASSWORD: familycircles
      POSTGRES_DB: familycircles
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familycircles -d familycircles"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "43127:3000"
    environment:
      DATABASE_URL: postgres://familycircles:familycircles@db:5432/familycircles
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      APP_URL: ${APP_URL:-http://127.0.0.1:43127}
      DATA_DIR: /data
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      # Originals and generated derivatives live here (Unraid: map a share)
      - media:/data

volumes:
  pgdata:
  media:
