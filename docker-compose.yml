services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: familycircles
      POSTGRES_PASSWORD: familycircles
      POSTGRES_DB: familycircles
    volumes:
      # Unraid: prefer a bind mount, e.g. /mnt/user/appdata/family-circles/pgdata
      - pgdata:/var/lib/postgresql/data
    # Not published to the host by default (app talks to db on the Docker network).
    # For local debugging: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familycircles -d familycircles"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # CI publishes this on every push to main (see .github/workflows/docker.yml).
    # Local: `docker compose up --build` builds and tags as this image name.
    # Unraid: `docker compose … pull && up -d` (no --build) pulls from GHCR.
    image: ${FAMILY_CIRCLES_IMAGE:-ghcr.io/purpleneckjellyfish/family-circles:latest}
    build: .
    container_name: family-circles
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host 43127 → container 3000 (point reverse proxy here or use Docker network)
      - "43127:3000"
    environment:
      DATABASE_URL: postgres://familycircles:familycircles@db:5432/familycircles
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      # Production: https://your.domain (must match the browser origin)
      APP_URL: ${APP_URL:-http://127.0.0.1:43127}
      AUTH_URL: ${AUTH_URL:-${APP_URL:-http://127.0.0.1:43127}}
      DATA_DIR: /data
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      # Originals live here. Unraid: prefer docker-compose.unraid.yml bind mounts.
      # /mnt/user/appdata/family-circles/data:/data
      - media:/data

volumes:
  pgdata:
  media:
