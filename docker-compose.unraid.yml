# Unraid override — pull the GHCR image from Actions (do not pass --build).
#
#   ./scripts/unraid-up.sh
#   # or:
#   docker compose -f docker-compose.yml -f docker-compose.unraid.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.unraid.yml up -d
#
# Optional pin: FAMILY_CIRCLES_IMAGE=ghcr.io/purpleneckjellyfish/family-circles:sha-<commit>

services:
  db:
    volumes:
      - /mnt/user/appdata/family-circles/pgdata:/var/lib/postgresql/data

  app:
    image: ${FAMILY_CIRCLES_IMAGE:-ghcr.io/purpleneckjellyfish/family-circles:latest}
    pull_policy: always
    container_name: family-circles
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://familycircles:familycircles@db:5432/familycircles
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      AUTH_URL: ${AUTH_URL:-${APP_URL}}
      DATA_DIR: /data
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - /mnt/user/appdata/family-circles/data:/data
