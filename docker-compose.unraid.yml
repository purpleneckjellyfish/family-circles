# Unraid override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.unraid.yml up --build -d
#
# Adjust host paths to your shares if needed.

services:
  db:
    ports: [] # keep Postgres off the LAN; app reaches it on the Docker network
    volumes:
      - /mnt/user/appdata/family-circles/pgdata:/var/lib/postgresql/data

  app:
    container_name: family-circles
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://familycircles:familycircles@db:5432/familycircles
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      AUTH_URL: ${AUTH_URL:-${APP_URL}}
      DATA_DIR: /data
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - /mnt/user/appdata/family-circles/data:/data
